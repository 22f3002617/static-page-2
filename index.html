<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Sales Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f4f4f4;
            text-align: left;
        }
        #total-sales {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Product Sales</h1>
    <table id="product-sales">
        <thead>
            <tr>
                <th>Product</th>
                <th>Total Sales ($)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Product A</td>
                <td>120.50</td>
            </tr>
            <tr>
                <td>Product B</td>
                <td>90.75</td>
            </tr>
            <tr>
                <td>Product C</td>
                <td>150.00</td>
            </tr>
        </tbody>
    </table>
    <p>Total Sales: <span id="total-sales"></span></p>
    <script>
        (function() {
            const tableRows = document.querySelectorAll("#product-sales tbody tr td:last-child");
            const totalSalesElement = document.getElementById('total-sales');
            let totalSales = 0;

            tableRows.forEach(cell => {
                totalSales += parseFloat(cell.textContent);
            });

            totalSalesElement.textContent = totalSales.toFixed(2);
        })();
    </script>
</body>
</html>
