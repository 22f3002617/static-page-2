<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Sales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #product-sales {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        #product-sales th, #product-sales td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #product-sales th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Product Sales</h1>
    <table id="product-sales">
        <thead>
            <tr>
                <th>Product</th>
                <th>Total Sales ($)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Product A</td>
                <td>100.50</td>
            </tr>
            <tr>
                <td>Product B</td>
                <td>200.75</td>
            </tr>
            <tr>
                <td>Product C</td>
                <td>150.25</td>
            </tr>
        </tbody>
    </table>
    <h2 id="total-sales">Total Sales: </h2>

    <script>
        (function() {
            // Calculate and display the total sales
            const rows = [...document.querySelectorAll("#product-sales tbody tr td:last-child")];
            const sum = rows.reduce((acc, cell) => acc + parseFloat(cell.textContent), 0);
            document.getElementById("total-sales").textContent = `Total Sales: $${sum.toFixed(2)}`;
        })();
    </script>
    <div id="markdown-output">
        <h3>Sample Markdown</h3>
        <p>This is a paragraph converted from Markdown.</p>
    </div>
</body>
</html>
