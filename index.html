<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Sales Tracker</title>
    <style>
        /* Placeholder for MIT License */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>Product Sales Tracker</h1>
    <table id="product-sales">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Total Sales</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Product A</td>
                <td>150.00</td>
            </tr>
            <tr>
                <td>Product B</td>
                <td>200.00</td>
            </tr>
            <tr>
                <td>Product C</td>
                <td>100.00</td>
            </tr>
        </tbody>
    </table>
    <div id="total-sales">
        Total Sales: $<span id="total">0.00</span>
    </div>
    <div id="markdown-output">
        <h2>Product Sales Overview</h2>
    </div>
    <script>
        (function() {
            const rows = [...document.querySelectorAll("#product-sales tbody tr td:last-child")];
            const sum = rows.reduce((acc, cell) => acc + parseFloat(cell.textContent), 0);
            document.getElementById("total").textContent = sum.toFixed(2);
        })();
    </script>
</body>
</html>
